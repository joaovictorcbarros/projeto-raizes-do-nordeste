<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Simulação via Cartão</title>
    <link rel="stylesheet" href="css/simulacao-pagamentos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="top-banner">
        <img src="img/ext-payment.png" alt="Internet Banking" class="top-logo">
    </div>

    <div class="content-simulacao">

        <div class="page-title">
            <h2><i class="fa-solid fa-credit-card"></i> Simulação de pagamento via Cartão</h2>
            <h3>Pedido #173120</h3>
        </div>

        <hr>

        <div class="value-table">
            <div class="value-col">
                <span>Valor do<br>pedido</span>
                <strong id="tabelaValorPedido">R$ 0,00</strong>
            </div>
            <div class="value-col">
                <span>Taxa do<br>pedido</span>
                <strong id="tabelaTaxaPedido">R$ 0,00</strong>
            </div>
            <div class="value-col">
                <span><br>Valor final</span>
                <strong id="tabelaValorFinal">R$ 0,00</strong>
            </div>
        </div>

        <hr>

        <div style="width: 100%; max-width: 400px; margin: 0 auto; text-align: left;">

            <label style="font-weight: 800; color: #555; font-size: 14px; margin-bottom: 5px; display: block;">Número do
                Cartão</label>
            <input type="text" id="numCartao" class="cpf-input" placeholder="0000 0000 0000 0000" maxlength="19"
                oninput="mascaraCartao(this)" style="margin: 0 0 15px 0; max-width: 100%;">

            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label
                        style="font-weight: 800; color: #555; font-size: 14px; margin-bottom: 5px; display: block;">Validade
                        (MM/AA)</label>
                    <input type="text" id="valCartao" class="cpf-input" placeholder="MM/AA" maxlength="5"
                        oninput="mascaraValidade(this)" style="margin: 0; max-width: 100%;">
                </div>
                <div style="flex: 1;">
                    <label
                        style="font-weight: 800; color: #555; font-size: 14px; margin-bottom: 5px; display: block;">CVV</label>
                    <input type="text" id="cvvCartao" class="cpf-input" placeholder="CVV" maxlength="3"
                        oninput="this.value = this.value.replace(/\D/g, ''); validarFormulario()"
                        style="margin: 0; max-width: 100%;">
                </div>
            </div>

            <label
                style="font-weight: 800; color: #555; font-size: 14px; margin-bottom: 5px; display: block;">CPF:</label>
            <input type="text" id="cpfInput" class="cpf-input" placeholder="777.777.777-77" maxlength="14"
                oninput="mascaraCPF(this)" style="margin: 0 0 20px 0; max-width: 100%;">
        </div>

        <button id="btnSimular" class="btn-simular" onclick="finalizarPagamento()" disabled>Simular Pagamento</button>

        <label class="lgpd-check">
            <input type="checkbox" id="termosCheck" onchange="validarFormulario()"> Aceitar termos de processamento -
            LGPD
        </label>
        <div class="security-badges">
            <span><i class="fa-solid fa-lock"></i> ambiente protegido</span>
            <div class="divider"></div>
            <span><i class="fa-solid fa-shield-halved"></i> ambiente seguro</span>
        </div>

        <div id="sucessoModal" class="modal-overlay" style="display: none;">
            <div class="modal-popup">
                <div class="modal-topo">
                    Sucesso
                </div>
                <div class="modal-corpo">
                    Simulação concluída. Pagamento aprovado e pedido confirmado!
                </div>
            </div>
        </div>
    </div>

    <script src="js/simulacao-pagamentos.js"></script>
</body>

</html>
